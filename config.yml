version: 2.1.1
base_install: true


# =============================================================================
# CONFIGURATION PRESETS (Recommended for most users)
# =============================================================================
#
# Choose a preset that matches your workflow. Presets configure all settings
# automatically. You can override individual settings below if needed.
#
# Available presets:
#
#   claude-code-full      - Claude Code with subagents and Skills (recommended)
#                           Best for: Complex projects, maximum context efficiency
#
#   claude-code-simple    - Claude Code without subagents, no Skills
#                           Best for: Simpler projects, faster execution
#
#   claude-code-basic     - Claude Code with minimal features
#                           Best for: Getting started, learning Agent OS
#
#   cursor                - Optimized for Cursor and similar tools
#                           Best for: Non-Claude Code AI coding tools
#
#   multi-tool            - Both Claude Code and agent-os formats
#                           Best for: Using multiple AI coding tools
#
#   custom                - Don't use preset, configure manually below
#                           Best for: Advanced users with specific needs
#
# =============================================================================

preset: claude-code-full


# =============================================================================
# ADVANCED: Manual Configuration
# =============================================================================
#
# IMPORTANT: When using a preset (not "custom"), these manual settings will
# OVERRIDE the preset defaults. This is intentional for advanced use cases,
# but most users should either:
#   1. Keep these settings commented out (let preset control everything)
#   2. Set preset to "custom" (configure everything manually)
#
# Configuration Priority (highest to lowest):
#   1. Command-line flags (--claude-code-commands, etc.)
#   2. These manual settings below (if uncommented)
#   3. Preset defaults
#
# What each preset sets:
#   claude-code-full:   claude_code=true, subagents=true, skills=true,  agent_os=false
#   claude-code-simple: claude_code=true, subagents=false, skills=true, agent_os=false
#   claude-code-basic:  claude_code=true, subagents=false, skills=false, agent_os=false
#   cursor:             claude_code=false, subagents=false, skills=false, agent_os=true
#   multi-tool:         claude_code=true, subagents=true, skills=true,  agent_os=true
#
# =============================================================================

# ================================================
# Do you use Claude Code?
# Controls whether commands are installed in .claude/commands/
#
# Uncomment to override preset:
# claude_code_commands: true
# ================================================


# ================================================
# Do you use other coding tools (Cursor, Windsurf, etc.)?
# Controls whether commands are installed in agent-os/commands/
#
# Uncomment to override preset:
# agent_os_commands: false
# ================================================


# ================================================
# Do you want Claude Code to use subagents?
# Controls whether to use .claude/agents/ with delegation pattern
# Requires claude_code_commands: true
#
# Uncomment to override preset:
# use_claude_code_subagents: true
# ================================================


# ================================================
# Should standards be provided to Claude Code as Skills?
# Controls whether standards use Skills feature vs inline injection
# Requires claude_code_commands: true
#
# Uncomment to override preset:
# standards_as_claude_code_skills: false
# ================================================


# ================================================
# PROFILE
#
# Use this profile by default.
#
# Override this default when running project-install.sh by using the flag --profile [profile-name]
# ================================================

profile: default
