name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install bats-core
      run: |
        sudo apt-get update
        sudo apt-get install -y bats

    - name: Run test suite
      run: |
        cd tests
        ./run-tests.sh -v

    - name: Test results summary
      if: always()
      run: echo "Test run completed"
